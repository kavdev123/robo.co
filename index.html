
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Builder & Repairs</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Ubuntu+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', cursive;
      background-color: #192841;
      color: #ffffff;
    }

    /* Jumbotron */
    .jumbotron {
      background-color: #ff5757;
      color: #223344;
      text-align: center;
      padding: 60px 20px;
      margin-bottom: 20px;
    }

    /* Home Button Section */
    .button-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .home-btn {
      flex: 1;
      max-width: 300px;
      padding: 30px 20px;
      font-size: 1.2rem;
      font-family: 'Press Start 2P', cursive;
      color: #ffffff;
      background-color: #223344;
      border: 3px solid #ff5757;
      border-radius: 15px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
    }

    .home-btn:hover {
      background-color: #ff5757;
      color: #223344;
      transform: scale(1.05);
    }

    /* Section Content (Forms) */
    .section-content {
      max-width: 900px;
      margin: 20px auto;
      background: #223344;
      padding: 40px;
      border-radius: 20px;
      border: 2px solid #ffffff;
      text-align: center;
      display: none;
    }

    label {
      color: #ffffff !important;
      font-family: 'Press Start 2P', cursive !important;
      font-size: 0.75rem;
    }

    .form-control, select, textarea {
      background-color: #192841;
      border: 2px solid #ff5757;
      color: #ffffff;
      height: 40px;
      font-size: 0.9rem;
      font-family: 'Ubuntu Mono', monospace;
      border-radius: 10px;
      padding: 12px 15px;
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 15px;
    }

    textarea.form-control {
      min-height: 100px;
    }

    .form-control:focus {
      outline: none;
      box-shadow: 0 0 10px #ff5757;
      background-color: #223344;
      color: #ffffff;
    }

    /* Dropdown options */
    select option {
      background-color: #223344;
      color: #ffffff;
    }

    /* Submit Button */
    .btn-submit {
      background-color: #ff5757;
      border: 2px solid #ffffff;
      color: #223344;
      font-size: 1.1rem;
      padding: 20px 40px;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Press Start 2P', cursive;
      transition: all 0.3s ease;
      margin-top: 15px;
    }

    .btn-submit:hover {
      background-color: #223344;
      color: #ffffff;
      border: 2px solid #ff5757;
      transform: scale(1.05);
    }

    /* Back to Home */
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 0.9rem;
      background-color: #192841;
      border: 2px solid #ff5757;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-family: 'Press Start 2P', cursive;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background-color: #ff5757;
      color: #223344;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 15px;
      background-color: #192841;
      color: #ffffff;
      font-size: 0.7rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Jumbotron -->
  <div class="jumbotron">
    <h1>Welcome to PC Solutions</h1>
    <p>Custom Builds • Repairs • Upgrades</p>
  </div>

  <!-- Home Buttons -->
  <div class="button-section" id="home-buttons">
    <button class="home-btn" onclick="showForm('custom-form')">Get a New PC</button>
    <button class="home-btn" onclick="showForm('repair-form')">PC Repairs</button>
    <button class="home-btn" onclick="showForm('upgrade-form')">Upgrade</button>
  </div>

  <!-- Custom Build Form -->
  <div id="custom-form" class="section-content">
    <h2>Custom PC Build</h2>
    <form>
      <label>Full Name *</label>
      <input type="text" class="form-control" required>
      <label>Email Address *</label>
      <input type="email" class="form-control" required>
      <label>Preferred Budget</label>
      <input type="text" class="form-control">
      <label>Requirements</label>
      <textarea class="form-control"></textarea>
      <button type="submit" class="btn-submit">Submit</button>
    </form>
    <button class="back-btn" onclick="goHome()">Back to Home</button>
  </div>

  <!-- PC Repair Form -->
  <div id="repair-form" class="section-content">
    <h2>PC Repair Request</h2>
    <form>
      <label>Full Name *</label>
      <input type="text" class="form-control" required>
      <label>Email Address *</label>
      <input type="email" class="form-control" required>
      <label>Issue Description</label>
      <textarea class="form-control"></textarea>
      <button type="submit" class="btn-submit">Submit</button>
    </form>
    <button class="back-btn" onclick="goHome()">Back to Home</button>
  </div>

  <!-- Upgrade Form -->
  <div id="upgrade-form" class="section-content">
    <h2>Upgrade Request</h2>
    <form>
      <label>Full Name *</label>
      <input type="text" class="form-control" required>
      <label>Email Address *</label>
      <input type="email" class="form-control" required>
      <label>Current PC Specs</label>
      <textarea class="form-control"></textarea>
      <label>Upgrade Needs</label>
      <textarea class="form-control"></textarea>
      <button type="submit" class="btn-submit">Submit</button>
    </form>
    <button class="back-btn" onclick="goHome()">Back to Home</button>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 PC Solutions. All Rights Reserved.</p>
  </footer>

  <!-- Scripts -->
  <script>
    function showForm(formId) {
      document.getElementById('home-buttons').style.display = 'none';
      document.querySelectorAll('.section-content').forEach(sec => sec.style.display = 'none');
      document.getElementById(formId).style.display = 'block';
    }
    function goHome() {
      document.getElementById('home-buttons').style.display = 'flex';
      document.querySelectorAll('.section-content').forEach(sec => sec.style.display = 'none');
    }
  </script>

</body>
</html>
